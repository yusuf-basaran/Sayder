<!doctype html>
<html lang="tr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="description" content="SAYDER SUNİ DERİ yetkili ürün ve stok yönetim paneli."><meta name="theme-color" content="#eaf6fc"><title>SAYDER SUNİ DERİ — Yönetim</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=4"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4"><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/identity.css"><script type="module" src="/js/admin.js"></script></head>
<body class="admin-body">
  <header class="site-header"><div class="wrap admin-header"><a href="/" class="brand-lockup brand"><img class="brand-logo" src="/sayder-logo.webp?v=4" alt="SAYDER SUNİ DERİ" width="300" height="72"></a><div class="admin-nav"><label class="language-control"><span>Dil</span><select id="language-select" aria-label="Dil"><option value="tr">Türkçe</option></select></label><a href="/" class="text-sm">Kataloğu aç ↗</a><button id="logout" class="button secondary compact" hidden>Çıkış yap</button></div></div></header>
  <main class="wrap pb-16">
    <p id="auth-status" class="notice" role="status">Oturum kontrol ediliyor…</p>
    <section id="login-view" class="login-card" hidden><p class="eyebrow">YÖNETİCİ GİRİŞİ</p><h1 class="text-3xl mt-3 mb-3">Koleksiyonunuzu yönetin.</h1><p class="muted mb-7">Yetkili hesabınızla güvenli giriş yapın.</p><form id="login-form"><label>E-posta<input name="email" type="email" autocomplete="username" required></label><label>Şifre<input name="password" type="password" autocomplete="current-password" required minlength="6"></label><button class="button w-full mt-4" type="submit">Giriş yap ↗</button></form><p id="login-message" class="notice mt-4" role="alert" hidden></p></section>
    <section id="admin-view" hidden>
      <div class="flex flex-wrap justify-between items-end gap-4 mb-8"><div><p class="eyebrow">YÖNETİM PANELİ</p><h1 class="text-4xl mt-2">Ürünler & koleksiyonlar</h1><p id="admin-email" class="muted mt-2"></p></div><button id="new-product" class="button">+ Yeni ürün</button></div>
      <p id="admin-message" class="notice" role="status" hidden></p>
      <div class="admin-layout">
        <aside><form id="product-form" class="panel"><div class="flex items-center justify-between mb-5"><h2 id="form-title" class="text-xl">Ürün ekle</h2><button type="button" id="reset-form" class="text-sm underline">Temizle</button></div>
          <label>Ürün adı<input name="name" maxlength="200" required></label>
          <label>Ürün kodu<input name="product_code" maxlength="60" required placeholder="SYD-101"></label>
          <label>Kategori<select name="category_id" required><option value="">Kategori seçin</option></select></label>
          <button type="button" id="open-category" class="text-sm underline mb-4">+ Kategori ekle / düzenle</button>
          <fieldset><legend class="text-sm mb-2">Suni deri ölçüleri</legend><div class="grid grid-cols-3 gap-2"><label>En (cm)<input name="width_cm" type="number" min="0.01" step="0.01" required></label><label>Kalınlık (mm)<input name="thickness_mm" type="number" min="0.01" step="0.01" required></label><label>Rulo (m)<input name="roll_length_m" type="number" min="0.01" step="0.01" required></label></div></fieldset>
          <label>Renk<input name="color" maxlength="100" required placeholder="Krem"></label>
          <div class="grid grid-cols-2 gap-3"><label>Kalan stok<input name="stock_quantity" type="number" min="0" max="9999999999.99" step="0.01" value="0" required></label><label>Stok birimi<select name="stock_unit"><option value="metre">Metre</option><option value="rulo">Rulo</option><option value="adet">Adet</option></select></label></div>
          <label>Materyal / kumaş<input name="material" maxlength="500" required></label><label>Renkler <span class="muted">(virgülle ayırın)</span><input name="colors" maxlength="1000" placeholder="Krem, Antrasit, Toprak"></label>
          <label>Görsel URL <span class="muted">(HTTPS)</span><input name="image_url" type="url" placeholder="https://..."></label><label>veya görsel yükle <span class="muted">(en fazla 5 MB)</span><input name="image_file" type="file" accept="image/jpeg,image/png,image/webp,image/avif"></label>
          <label>Açıklama<textarea name="description" rows="4" maxlength="10000"></textarea></label><label class="check-label"><input name="is_active" type="checkbox" checked> Katalogda yayınla</label><button id="save-product" class="button w-full mt-4" type="submit">Ürünü kaydet</button>
        </form></aside>
        <div class="panel self-start"><div class="flex flex-wrap justify-between items-center gap-3 mb-5"><h2 class="text-xl">Ürün & stok listesi</h2><label class="search-box"><input id="admin-search" type="search" maxlength="100" aria-label="Ürün listesinde ara" placeholder="Ürün, kod veya renk ara"></label></div><div class="table-scroll"><table><thead><tr><th>Ürün</th><th>Kalan stok</th><th>Durum</th><th>İşlemler</th></tr></thead><tbody id="product-rows"></tbody></table></div><div class="flex justify-between items-center mt-5 gap-3"><button id="previous" class="button secondary compact">← Önceki</button><span id="page-info" class="text-sm muted"></span><button id="next" class="button secondary compact">Sonraki →</button></div></div>
      </div>
    </section>
  </main>
  <dialog id="category-dialog" aria-labelledby="category-title"><div class="dialog-shell category-shell"><button data-close class="dialog-close" aria-label="Kategori penceresini kapat">×</button><h2 id="category-title" class="text-2xl mb-6">Kategoriler</h2><form id="category-form"><label>Kategori adı<input name="name" maxlength="100" required></label><label>Slug<input name="slug" maxlength="120" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="otomatik-olusturulur"></label><div class="flex gap-3"><button class="button" type="submit">Kaydet</button><button id="category-reset" type="button" class="button secondary">Yeni kategori</button></div></form><p id="category-message" role="status" class="notice mt-4" hidden></p><ul id="category-list" class="mt-6"></ul></div></dialog>
</body>
</html>
